name: controls-audit

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controls-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate controls
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FAIL=0
          REPORT_FILE=controls-audit-report.md
          : > "$REPORT_FILE"

          pass() { echo "- PASS: $1" >> "$REPORT_FILE"; }
          fail() { echo "- FAIL: $1" >> "$REPORT_FILE"; FAIL=1; }

          echo "## Controls audit report" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "### Branch protection: main" >> "$REPORT_FILE"

          BP_JSON=$(gh api "repos/$REPO/branches/main/protection" 2>/dev/null || true)
          BP_ERROR=$(echo "$BP_JSON" | jq -r 'if type == "object" and has("message") then .message else empty end' 2>/dev/null || echo "unparseable response")
          if [ -z "$BP_JSON" ] || [ -n "$BP_ERROR" ]; then
            # The workflow token usually cannot read protection settings; report that
            # as UNKNOWN evidence instead of claiming each individual rule is disabled.
            fail "Unable to read branch protection for main (${BP_ERROR:-empty response}); protection rules are UNKNOWN, not verified."
          else
            PR_REQUIRED=$(echo "$BP_JSON" | jq 'has("required_pull_request_reviews") and (.required_pull_request_reviews.required_approving_review_count >= 1)')
            STRICT_UPTODATE=$(echo "$BP_JSON" | jq '.required_status_checks.strict == true')
            HAS_TEST_BUILD=$(echo "$BP_JSON" | jq '(.required_status_checks.contexts // []) | index("test-and-build") != null')
            HAS_CODEQL=$(echo "$BP_JSON" | jq '(.required_status_checks.contexts // []) | index("CodeQL") != null')
            FORCE_PUSH_DISABLED=$(echo "$BP_JSON" | jq '.allow_force_pushes.enabled == false')
            DELETIONS_DISABLED=$(echo "$BP_JSON" | jq '.allow_deletions.enabled == false')

            [ "$PR_REQUIRED" = "true" ] && pass "Require PR + >=1 approving review enabled" || fail "Require PR + >=1 approving review not enforced"
            [ "$STRICT_UPTODATE" = "true" ] && pass "Require branches up to date enabled" || fail "Require branches up to date is disabled"
            [ "$HAS_TEST_BUILD" = "true" ] && pass "Required check includes test-and-build" || fail "Required check missing: test-and-build"
            [ "$HAS_CODEQL" = "true" ] && pass "Required check includes CodeQL" || fail "Required check missing: CodeQL"
            [ "$FORCE_PUSH_DISABLED" = "true" ] && pass "Force pushes disabled" || fail "Force pushes are allowed"
            [ "$DELETIONS_DISABLED" = "true" ] && pass "Branch deletions disabled" || fail "Branch deletions are allowed"
          fi

          echo "" >> "$REPORT_FILE"
          echo "### Workflow controls" >> "$REPORT_FILE"

          SAFE=".github/workflows/safe-automerge.yml"
          if [ ! -f "$SAFE" ]; then
            fail "$SAFE missing"
          else
            grep -q -- '--match-head-commit' "$SAFE" && pass "$SAFE merges only at the evaluated head SHA" || fail "$SAFE merge is not pinned to the head SHA"
            grep -q "vars.AUTOMERGE_MODE == 'enforce'" "$SAFE" && pass "$SAFE merge is gated on AUTOMERGE_MODE=enforce" || fail "$SAFE merge is not gated on AUTOMERGE_MODE"
            grep -q 'automerge-eligibility-cli.ts' "$SAFE" && pass "$SAFE uses the shared eligibility policy" || fail "$SAFE does not use the shared eligibility policy"
            grep -Eq '^[[:space:]]+pull_request(_target)?:' "$SAFE" && fail "$SAFE runs on PR events (PR-controlled context)" || pass "$SAFE does not run on PR events"
          fi

          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            # This audit file contains the patterns it searches for.
            [ "$file" = ".github/workflows/controls-audit.yml" ] && continue
            grep -Eq 'gh pr merge[^#]*--admin' "$file" && fail "$file merges with --admin (branch-protection bypass)"
            grep -Eq 'gh pr review[^#]*--approve|event: .APPROVE' "$file" && fail "$file submits PR approvals"
            grep -Eq 'gh pr merge[^#]*--auto' "$file" && fail "$file arms --auto merge"
            if grep -q 'gh pr merge' "$file" && [ "$file" != "$SAFE" ]; then
              fail "$file merges PRs outside safe-automerge.yml"
            fi
          done
          pass "workflow merge/approval scan complete"

          echo "" >> "$REPORT_FILE"
          if [ "$FAIL" -eq 0 ]; then
            echo "Audit result: PASS" >> "$REPORT_FILE"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "Audit result: FAIL" >> "$REPORT_FILE"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Open/append controls drift issue
        if: steps.audit.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Controls audit drift detected on main';
            const {owner, repo} = context.repo;
            const report = require('fs').readFileSync('controls-audit-report.md', 'utf8');

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'controls-audit',
              per_page: 100
            });

            const existing = openIssues.data.find(i => i.title === title);

            const body = [
              'Automated controls audit detected configuration drift.',
              '',
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              '```markdown',
              report,
              '```'
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: ['controls-audit'],
                body
              });
            }

      - name: Fail loudly on drift
        if: steps.audit.outputs.drift == 'true'
        run: |
          echo "Controls audit drift detected. See workflow summary and controls-audit issue."
          exit 1