name: auto-merge

on:
  create:

permissions: {}

jobs:
  open-pr-on-branch:
    permissions:
      pull-requests: write
    # Opening a branch creates a draft PR only. All merge arming is delegated
    # to the pull_request_target safe-automerge workflow and its pure policy.
    if: >-
      github.event_name == 'create' &&
      github.ref_type == 'branch' &&
      github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$HEAD_BRANCH" --base main --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            pr_body=$'Auto-opened as a DRAFT by the branch workflow. This workflow never approves or arms auto-merge.\n\nThe separate safe-automerge policy requires exact bot identity, an allowed branch and file scope, an independent human approval, and successful required checks on the exact head SHA.'
            gh pr create \
              --title "auto: ${HEAD_BRANCH}" \
              --body "$pr_body" \
              --base main \
              --head "$HEAD_BRANCH" \
              --draft
          fi
