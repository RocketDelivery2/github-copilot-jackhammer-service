name: auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  create:

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write

jobs:
  open-pr-on-branch:
    # When a new branch is pushed, open a DRAFT PR targeting main.
    # Draft prevents auto-merge from arming until a human marks it ready.
    if: >-
      github.event_name == 'create' &&
      github.ref_type == 'branch' &&
      github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preflight create trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "create" ]; then
            echo "auto-merge: expected create trigger but received $EVENT_NAME."
            exit 64
          fi
          if [ "$REF_TYPE" != "branch" ]; then
            echo "auto-merge: expected branch create trigger but received ref type $REF_TYPE."
            exit 64
          fi
          if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "auto-merge: expected repository default branch main but received $DEFAULT_BRANCH."
            exit 64
          fi

      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_transient_gh_error() {
            printf '%s' "$1" | grep -Eiq 'ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|socket hang up|temporary failure|rate limit|502|503|504'
          }

          retry_gh() {
            attempts=3
            delay=2
            attempt=1
            while true; do
              if output="$("$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              if is_transient_gh_error "$output" && [ "$attempt" -lt "$attempts" ]; then
                echo "Transient GitHub CLI error (attempt $attempt/$attempts); retrying in ${delay}s..." >&2
                sleep "$delay"
                delay=$((delay * 2))
                attempt=$((attempt + 1))
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$status"
            done
          }

          existing=$(retry_gh gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            retry_gh gh pr create \
              --title "auto: ${GITHUB_REF_NAME}" \
              --body "Auto-opened by auto-merge workflow. **This PR is a DRAFT.**

To enable auto-merge:
1. Complete changes and mark the PR ready for review.
2. Add the \`auto-merge\` label.

Auto-merge will NOT fire while this PR is in draft state." \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --draft
          fi

  approve-and-merge:
    # Evaluate safety gates before arming auto-merge.
    # Auto-merge is BLOCKED unless ALL gates pass.
    # Every decision (allow or block) is written to the workflow step summary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Preflight pull_request trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "auto-merge: expected pull_request trigger but received $EVENT_NAME."
            exit 64
          fi
          if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "auto-merge: expected repository default branch main but received $DEFAULT_BRANCH."
            exit 64
          fi
          if [ -n "$DEFAULT_BRANCH" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "auto-merge: expected PR target branch $DEFAULT_BRANCH but received $BASE_REF."
            exit 64
          fi

      - name: Evaluate safety gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          GATE_PASS=true
          GATE_LOG=""

          # Gate 1: PR must not be draft
          if [ "$IS_DRAFT" = "true" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 1: draft check | BLOCKED | PR is still in draft state |\n"
          else
            GATE_LOG="${GATE_LOG}| Gate 1: draft check | PASS | PR is not draft |\n"
          fi

          # Gate 2: explicit allow - label or allowed bot actor
          LABELS_JSON=$(retry_gh gh pr view "$PR_URL" --json labels --jq '[.labels[].name]')
          HAS_LABEL=$(echo "$LABELS_JSON" | jq 'contains(["auto-merge"])')

          ACTOR_ALLOWED=false
          for allowed in "dependabot[bot]"; do
            if [ "$ACTOR" = "$allowed" ]; then ACTOR_ALLOWED=true; break; fi
          done

          if [ "$HAS_LABEL" = "true" ] || [ "$ACTOR_ALLOWED" = "true" ]; then
            GATE_LOG="${GATE_LOG}| Gate 2: explicit allow | PASS | auto-merge label present or actor is allowed bot |\n"
          else
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 2: explicit allow | BLOCKED | no auto-merge label; actor not in allowlist |\n"
          fi

          # Gate 3: policy-sensitive labels block unconditionally
          SENSITIVE=$(echo "$LABELS_JSON" | jq '[.[] | select(. == "security" or . == "breaking-change" or . == "do-not-merge")] | length')
          if [ "$SENSITIVE" -gt "0" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 3: policy labels | BLOCKED | security/breaking-change/do-not-merge label present |\n"
          else
            GATE_LOG="${GATE_LOG}| Gate 3: policy labels | PASS | no policy-sensitive labels |\n"
          fi

          echo "gate_pass=$GATE_PASS" >> $GITHUB_OUTPUT
          {
            echo "gate_log<<EOF"
            printf "$GATE_LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Write gate summary to workflow log
        if: always()
        env:
          GATE_PASS: ${{ steps.gates.outputs.gate_pass }}
          GATE_LOG: ${{ steps.gates.outputs.gate_log }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Auto-merge gate evaluation -- PR #${PR_NUMBER}"
            echo ""
            if [ "$GATE_PASS" = "true" ]; then
              echo "Decision: ALLOW -- all gates passed; arming squash auto-merge."
            else
              echo "Decision: BLOCK -- one or more gates failed; auto-merge NOT armed."
            fi
            echo ""
            echo "| Gate | Result | Reason |"
            echo "|------|--------|--------|"
            printf "$GATE_LOG"
          } >> $GITHUB_STEP_SUMMARY

      - name: Arm squash auto-merge
        if: steps.gates.outputs.gate_pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_transient_gh_error() {
            printf '%s' "$1" | grep -Eiq 'ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|socket hang up|temporary failure|rate limit|502|503|504'
          }

          retry_gh() {
            attempts=3
            delay=2
            attempt=1
            while true; do
              if output="$("$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              if is_transient_gh_error "$output" && [ "$attempt" -lt "$attempts" ]; then
                echo "Transient GitHub CLI error (attempt $attempt/$attempts); retrying in ${delay}s..." >&2
                sleep "$delay"
                delay=$((delay * 2))
                attempt=$((attempt + 1))
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$status"
            done
          }

          retry_gh gh pr merge --auto --squash --delete-branch \
            "${{ github.event.pull_request.html_url }}"