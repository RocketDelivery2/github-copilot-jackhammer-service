name: auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  create:

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write

jobs:
  open-pr-on-branch:
    # When a new branch is pushed, open a DRAFT PR targeting main.
    # Draft prevents auto-merge from arming until a human marks it ready.
    if: >-
      github.event_name == 'create' &&
      github.ref_type == 'branch' &&
      github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Create draft PR if none exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh pr create \
              --title "auto: ${GITHUB_REF_NAME}" \
              --body "Auto-opened by auto-merge workflow. **This PR is a DRAFT.**

To enable auto-merge:
1. Complete changes and mark the PR ready for review.
2. Add the \`auto-merge\` label.

Auto-merge will NOT fire while this PR is in draft state." \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --draft
          fi

  approve-and-merge:
    # Evaluate safety gates before arming auto-merge.
    # Auto-merge is BLOCKED unless ALL gates pass.
    # Every decision (allow or block) is written to the workflow step summary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate safety gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          GATE_PASS=true
          GATE_LOG=""

          # Gate 1: PR must not be draft
          if [ "$IS_DRAFT" = "true" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 1: draft check | BLOCKED | PR is still in draft state |\n"
          else
            GATE_LOG="${GATE_LOG}| Gate 1: draft check | PASS | PR is not draft |\n"
          fi

          # Gate 2: explicit allow - label or allowed bot actor
          LABELS_JSON=$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name]')
          HAS_LABEL=$(echo "$LABELS_JSON" | jq 'contains(["auto-merge"])')

          ACTOR_ALLOWED=false
          for allowed in "dependabot[bot]"; do
            if [ "$ACTOR" = "$allowed" ]; then ACTOR_ALLOWED=true; break; fi
          done

          if [ "$HAS_LABEL" = "true" ] || [ "$ACTOR_ALLOWED" = "true" ]; then
            GATE_LOG="${GATE_LOG}| Gate 2: explicit allow | PASS | auto-merge label present or actor is allowed bot |\n"
          else
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 2: explicit allow | BLOCKED | no auto-merge label; actor not in allowlist |\n"
          fi

          # Gate 3: policy-sensitive labels block unconditionally
          SENSITIVE=$(echo "$LABELS_JSON" | jq '[.[] | select(. == "security" or . == "breaking-change" or . == "do-not-merge")] | length')
          if [ "$SENSITIVE" -gt "0" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 3: policy labels | BLOCKED | security/breaking-change/do-not-merge label present |\n"
          else
            GATE_LOG="${GATE_LOG}| Gate 3: policy labels | PASS | no policy-sensitive labels |\n"
          fi

          echo "gate_pass=$GATE_PASS" >> $GITHUB_OUTPUT
          {
            echo "gate_log<<EOF"
            printf "$GATE_LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Write run manifest and summary
        if: always()
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_MANIFEST_PATH: .ai/run-manifest.json
          GATE_PASS: ${{ steps.gates.outputs.gate_pass }}
          GATE_LOG: ${{ steps.gates.outputs.gate_log }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ai

          if [ "$GATE_PASS" = "true" ]; then
            DECISION="allow"
            DECISION_LABEL="ALLOW"
            DECISION_REASON="all gates passed; arming squash auto-merge."
          else
            DECISION="block"
            DECISION_LABEL="BLOCK"
            DECISION_REASON="one or more gates failed; auto-merge NOT armed."
          fi

          jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg commit "$COMMIT_SHA" \
            --arg decision "$DECISION" \
            --arg decision_reason "$DECISION_REASON" \
            --arg pr_number "$PR_NUMBER" \
            --arg gate_log "$GATE_LOG" \
            '{
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              commit: $commit,
              decision: $decision,
              decision_reason: $decision_reason,
              pr_number: $pr_number,
              gate_log: $gate_log
            }' > "$RUN_MANIFEST_PATH"

          {
            echo "## Auto-merge run"
            echo ""
            echo "| Field | Value |"
            echo "|------|-------|"
            echo "| Workflow | ${WORKFLOW_NAME} |"
            echo "| Run ID | ${RUN_ID} |"
            echo "| Attempt | ${RUN_ATTEMPT} |"
            echo "| Commit | ${COMMIT_SHA} |"
            echo "| Decision | ${DECISION_LABEL} |"
            echo "| Reason | ${DECISION_REASON} |"
            echo "| PR | #${PR_NUMBER} |"
            echo "| Manifest | ${RUN_MANIFEST_PATH} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload run manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest
          path: .ai/run-manifest.json
          if-no-files-found: warn

      - name: Arm squash auto-merge
        if: steps.gates.outputs.gate_pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash --delete-branch \
            "${{ github.event.pull_request.html_url }}" \
            || echo "Auto-merge already enabled or PR already merged."