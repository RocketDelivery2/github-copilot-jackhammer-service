name: auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  create:

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr-on-branch:
    permissions:
      contents: read
      pull-requests: write
    # When a new branch is pushed, open a DRAFT PR targeting main.
    # Draft prevents auto-merge from arming until a human marks it ready.
    if: >-
      github.event_name == 'create' &&
      github.ref_type == 'branch' &&
      github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh pr create \
              --title "auto: ${GITHUB_REF_NAME}" \
              --body "Auto-opened by auto-merge workflow. **This PR is a DRAFT.**

Auto-merge is only available for approved bot-authored PRs.

To enable auto-merge:
1. Ensure the PR is authored by an approved bot.
2. Complete changes and mark the PR ready for review.
3. Add the \`auto-merge\` label.

Auto-merge will NOT fire while this PR is in draft state or while required checks/reviews are still pending." \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --draft
          fi

  approve-and-merge:
    permissions:
      contents: write
      pull-requests: write
    # Evaluate safety gates before arming auto-merge.
    # Auto-merge is BLOCKED unless ALL gates pass.
    # Every decision (allow or block) is written to the workflow step summary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Evaluate safety gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          PR_CONTEXT_JSON=$(gh pr view "$PR_URL" --json author,isDraft,labels,reviewDecision,mergeStateStatus,number,url)
          EVALUATION_JSON=$(AUTO_MERGE_PR_CONTEXT_JSON="$PR_CONTEXT_JSON" AUTO_MERGE_REQUIRE_POLICY_LABEL=true AUTO_MERGE_POLICY_LABEL=auto-merge node --import tsx src/auto-merge-policy-cli.ts)
          GATE_PASS=$(echo "$EVALUATION_JSON" | jq -r '.allowed')
          GATE_LOG=$(echo "$EVALUATION_JSON" | jq -r '.gates[] | "| " + .name + " | " + (if .allowed then "PASS" else "BLOCKED" end) + " | " + .detail + " |"')

          # Gate 1: PR must not be draft
          if [ "$IS_DRAFT" = "true" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 1: draft check | BLOCKED | PR is still in draft state |\n"
          else
            GATE_LOG="${GATE_LOG}| Gate 1: draft check | PASS | PR is not draft |\n"
          fi

          # Gate 2: explicit allow - label or allowed bot author
          LABELS_JSON=$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name]')
          HAS_LABEL=$(echo "$LABELS_JSON" | jq 'contains(["auto-merge"])')

          AUTHOR_ALLOWED=false
          for allowed in "dependabot[bot]"; do
            if [ "$PR_AUTHOR" = "$allowed" ]; then AUTHOR_ALLOWED=true; break; fi
          done

          if [ "$HAS_LABEL" = "true" ] || [ "$AUTHOR_ALLOWED" = "true" ]; then
            GATE_LOG="${GATE_LOG}| Gate 2: explicit allow | PASS | auto-merge label present or PR author is allowed bot |\n"
          else
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 2: explicit allow | BLOCKED | no auto-merge label; PR author not in allowlist |\n"
          fi

          # Gate 3: policy-sensitive labels block unconditionally
          SENSITIVE=$(echo "$LABELS_JSON" | jq '[.[] | select(. == "security" or . == "breaking-change" or . == "do-not-merge")] | length')
          if [ "$SENSITIVE" -gt "0" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Gate 3: policy labels | BLOCKED | security/breaking-change/do-not-merge label present |\n"
          else
            GATE_LOG="${GATE_LOG}| Gate 3: policy labels | PASS | no policy-sensitive labels |\n"
          fi

          echo "gate_pass=$GATE_PASS" >> $GITHUB_OUTPUT
          echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "has_auto_merge_label=$HAS_LABEL" >> $GITHUB_OUTPUT
          echo "author_allowed=$AUTHOR_ALLOWED" >> $GITHUB_OUTPUT
          LABELS_CSV=$(echo "$LABELS_JSON" | jq -r 'if length == 0 then "(none)" else join(", ") end')
          {
            echo "labels_csv<<EOF"
            printf "%s\n" "$LABELS_CSV"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "gate_log<<EOF"
            printf "$GATE_LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write gate summary to workflow log
        if: always()
        env:
          GATE_PASS: ${{ steps.gates.outputs.gate_pass }}
          GATE_LOG: ${{ steps.gates.outputs.gate_log }}
          PR_AUTHOR: ${{ steps.gates.outputs.pr_author }}
          HAS_AUTO_MERGE_LABEL: ${{ steps.gates.outputs.has_auto_merge_label }}
          AUTHOR_ALLOWED: ${{ steps.gates.outputs.author_allowed }}
          LABELS_CSV: ${{ steps.gates.outputs.labels_csv }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Auto-merge gate evaluation -- PR #${PR_NUMBER}"
            echo ""
            if [ "$GATE_PASS" = "true" ]; then
              echo "Decision: ALLOW -- all gates passed; arming squash auto-merge."
            else
              echo "Decision: BLOCK -- one or more gates failed; auto-merge NOT armed."
            fi
            echo ""
            echo "| Context | Value |"
            echo "|---------|-------|"
            echo "| PR author | ${PR_AUTHOR} |"
            echo "| Event actor | ${EVENT_ACTOR} |"
            echo "| auto-merge label present | ${HAS_AUTO_MERGE_LABEL} |"
            echo "| author in bot allowlist | ${AUTHOR_ALLOWED} |"
            echo "| labels | ${LABELS_CSV} |"
            echo ""
            echo "| Gate | Result | Reason |"
            echo "|------|--------|--------|"
            printf "$GATE_LOG"
          } >> $GITHUB_STEP_SUMMARY

      - name: Arm squash auto-merge
        if: steps.gates.outputs.gate_pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          MERGED_AT=$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt')
          AUTO_MERGE_ENABLED=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$MERGED_AT" != "null" ]; then
            echo "PR is already merged; auto-merge arming skipped."
            exit 0
          fi
          if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
            echo "Auto-merge already enabled; nothing to change."
            exit 0
          fi
          gh pr merge --auto --squash --delete-branch "$PR_URL"