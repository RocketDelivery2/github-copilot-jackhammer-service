name: auto-merge

# Opens a draft PR for newly pushed branches. This workflow never approves or
# merges; unattended merging is handled only by safe-automerge.yml.
on:
  create:

permissions: {}

concurrency:
  group: auto-merge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr-on-branch:
    permissions:
      contents: read
      pull-requests: write
    # When a new branch is pushed, open a DRAFT PR targeting main.
    if: >-
      github.event_name == 'create' &&
      github.ref_type == 'branch' &&
      github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            pr_body=$'Auto-opened by auto-merge workflow. **This PR is a DRAFT.**\n\nThis workflow never approves or merges. Labels do not authorize merging.\n\nUnattended merge is limited to the allowlisted task types in `.github/docs/auto-merge-policy.md` and is evaluated by `safe-automerge.yml`. All other PRs require a human merge.'
            gh pr create \
              --title "auto: ${GITHUB_REF_NAME}" \
              --body "$pr_body" \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --draft
          fi
