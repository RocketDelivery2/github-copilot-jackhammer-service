name: dependabot-auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate for Dependabot auto-merge'
        required: true
        type: string

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge for eligible Dependabot PRs
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'check_run' || github.event.check_run.name == 'test-and-build' || github.event.check_run.name == 'Analyze (javascript-typescript)')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR number
        id: resolve
        env:
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${PR_NUMBER_INPUT:-$EVENT_PR_NUMBER}"
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR number must be a positive decimal integer."
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted policy code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.resolve.outputs.pr_number }}

      - name: Evaluate policy gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          REPO: ${{ github.repository }}
          DEPENDENCY_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json author,baseRefName,changedFiles,headRefName,headRefOid,isDraft,labels,mergeStateStatus,number,reviewDecision,reviews,state,url,autoMergeRequest)
          HEAD_SHA=$(jq -er '.headRefOid | select(test("^[0-9a-f]{40}$"))' <<<"$PR_JSON")
          HEAD_AUTHOR_LOGIN=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.author.login // ""')
          FILES_JSON=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[]' | jq -s '[.[].filename]')
          CHECKS_JSON=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status: (.status | ascii_upcase), conclusion: (if .conclusion == null then null else (.conclusion | ascii_upcase) end), headSha: .head_sha}' \
            | jq -s '.')
          PR_CONTEXT_JSON=$(jq -n \
            --argjson pr "$PR_JSON" \
            --arg head_author "$HEAD_AUTHOR_LOGIN" \
            --argjson files "$FILES_JSON" \
            --argjson checks "$CHECKS_JSON" \
            --arg update_type "$DEPENDENCY_UPDATE_TYPE" \
            --arg dependency_type "$DEPENDENCY_TYPE" \
            '{
              number: $pr.number,
              url: $pr.url,
              author: $pr.author,
              headCommitAuthor: {login: $head_author},
              isDraft: $pr.isDraft,
              state: $pr.state,
              baseRefName: $pr.baseRefName,
              headRefName: $pr.headRefName,
              headSha: $pr.headRefOid,
              changedFileCount: $pr.changedFiles,
              files: $files,
              checks: $checks,
              labels: [$pr.labels[] | {name}],
              reviews: [$pr.reviews[] | {login: (.author.login // ""), state}],
              reviewDecision: $pr.reviewDecision,
              mergeStateStatus: $pr.mergeStateStatus,
              dependencyUpdateType: (if $update_type == "" then null else $update_type end),
              dependencyType: (if $dependency_type == "" then null else $dependency_type end),
              autoMergeEnabled: ($pr.autoMergeRequest != null)
            }')
          EVALUATION_JSON=$(AUTO_MERGE_PR_CONTEXT_JSON="$PR_CONTEXT_JSON" node --import tsx --input-type=module -e '
            import process from "node:process";
            import { evaluateAutoMergePolicy } from "./src/auto-merge-policy.ts";
            const context = JSON.parse(process.env.AUTO_MERGE_PR_CONTEXT_JSON ?? "");
            process.stdout.write(JSON.stringify(evaluateAutoMergePolicy(context, {
              requirePolicyLabel: false,
              requireDependencyUpdateType: true,
            })));
          ')
          GATE_PASS=$(jq -r '.allowed' <<<"$EVALUATION_JSON")
          DO_ARM=$(jq -r '.doArm' <<<"$EVALUATION_JSON")
          GATE_LOG=$(jq -r '.gates[] | "| " + .name + " | " + (if .allowed then "PASS" else "BLOCKED" end) + " | " + .detail + " |"' <<<"$EVALUATION_JSON")
          echo "gate_pass=$GATE_PASS" >> "$GITHUB_OUTPUT"
          echo "do_arm=$DO_ARM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          {
            echo 'gate_log<<JH_GATE_LOG'
            printf '%s\n' "$GATE_LOG"
            echo 'JH_GATE_LOG'
          } >> "$GITHUB_OUTPUT"

      - name: Write decision summary
        if: always()
        env:
          GATE_PASS: ${{ steps.gates.outputs.gate_pass }}
          DO_ARM: ${{ steps.gates.outputs.do_arm }}
          GATE_LOG: ${{ steps.gates.outputs.gate_log }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          {
            echo "## Dependabot auto-merge policy evaluation — PR #${PR_NUMBER}"
            echo ""
            if [ "$GATE_PASS" = "true" ]; then
              if [ "$DO_ARM" = "true" ]; then
                echo "Decision: ALLOW — patch/minor development dependency gates passed; native auto-merge will be armed."
              else
                echo "Decision: NOOP — eligible PR already has native auto-merge armed."
              fi
            else
              echo "Decision: BLOCK — one or more fail-closed gates did not pass."
            fi
            echo ""
            echo "| Gate | Result | Reason |"
            echo "|------|--------|--------|"
            printf '%s\n' "$GATE_LOG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge for eligible Dependabot PR
        if: steps.gates.outputs.do_arm == 'true'
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.gates.outputs.head_sha }}
        run: gh pr merge --auto --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_NUMBER" --repo "$REPO"
