name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Evaluate policy gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          GATE_PASS=true
          GATE_LOG=""

          LABELS_JSON=$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name]')
          DENY_COUNT=$(echo "$LABELS_JSON" | jq '[.[] | select(. == "security" or . == "breaking-change" or . == "do-not-merge")] | length')

          if [ "$DENY_COUNT" -gt "0" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Deny-label policy | BLOCKED | security/breaking-change/do-not-merge label present |\n"
          else
            GATE_LOG="${GATE_LOG}| Deny-label policy | PASS | no deny labels present |\n"
          fi

          echo "gate_pass=$GATE_PASS" >> $GITHUB_OUTPUT
          echo "labels_json=$LABELS_JSON" >> $GITHUB_OUTPUT
          {
            echo "gate_log<<EOF"
            printf "$GATE_LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Write decision summary and artifact
        if: always()
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
          GATE_PASS: ${{ steps.gates.outputs.gate_pass }}
          GATE_LOG: ${{ steps.gates.outputs.gate_log }}
          LABELS_JSON: ${{ steps.gates.outputs.labels_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path('.workflow-reports')
          report_dir.mkdir(parents=True, exist_ok=True)
          report_path = report_dir / 'dependabot-auto-merge-report.json'

          labels = json.loads(os.environ['LABELS_JSON'])
          gate_pass = os.environ['GATE_PASS'] == 'true'
          decision = 'ALLOW' if gate_pass else 'BLOCK'

          report = {
              'workflow': os.environ['WORKFLOW_NAME'],
              'run_id': int(os.environ['RUN_ID']),
              'run_number': int(os.environ['RUN_NUMBER']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'commit': os.environ['COMMIT_SHA'],
              'ref_name': os.environ['REF_NAME'],
              'pr_number': int(os.environ['PR_NUMBER']),
              'pr_url': os.environ['PR_URL'],
              'actor': os.environ['ACTOR'],
              'decision': decision,
              'gate_pass': gate_pass,
              'gate_log': os.environ['GATE_LOG'],
              'labels': labels,
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = [
              f'## Dependabot auto-merge policy evaluation -- PR #{report["pr_number"]}',
              '',
              '| Field | Value |',
              '|------|-------|',
              f"| Workflow | {report['workflow']} |",
              f"| Run ID | {report['run_id']} |",
              f"| Attempt | {report['run_attempt']} |",
              f"| Commit | `{report['commit']}` |",
              f"| Branch | `{report['ref_name']}` |",
              f"| PR | [#{report['pr_number']}]({report['pr_url']}) |",
              f"| Actor | `{report['actor']}` |",
              f"| Decision | {decision} |",
              '',
              '| Gate | Result | Reason |',
              '|------|--------|--------|',
              report['gate_log'].rstrip('\n'),
              '',
              f'Machine-readable report: `{report_path.as_posix()}`',
              '',
          ]
          summary.open('a', encoding='utf-8').write('\n'.join(lines))
          PY

      - name: Upload decision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-auto-merge-report
          path: .workflow-reports/dependabot-auto-merge-report.json
          if-no-files-found: error

      - name: Enable auto-merge for dependabot PR
        if: steps.gates.outputs.gate_pass == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge already enabled or not applicable; skipping."