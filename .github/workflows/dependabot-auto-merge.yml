name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Preflight dependabot trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request_target" ]; then
            echo "dependabot-auto-merge: expected pull_request_target trigger but received $EVENT_NAME."
            exit 64
          fi
          if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "dependabot-auto-merge: expected repository default branch main but received $DEFAULT_BRANCH."
            exit 64
          fi
          if [ -n "$DEFAULT_BRANCH" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "dependabot-auto-merge: expected PR target branch $DEFAULT_BRANCH but received $BASE_REF."
            exit 64
          fi

      - name: Evaluate policy gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          GATE_PASS=true
          GATE_LOG=""

          LABELS_JSON=$(retry_gh gh pr view "$PR_URL" --json labels --jq '[.labels[].name]')
          DENY_COUNT=$(echo "$LABELS_JSON" | jq '[.[] | select(. == "security" or . == "breaking-change" or . == "do-not-merge")] | length')

          if [ "$DENY_COUNT" -gt "0" ]; then
            GATE_PASS=false
            GATE_LOG="${GATE_LOG}| Deny-label policy | BLOCKED | security/breaking-change/do-not-merge label present |\n"
          else
            GATE_LOG="${GATE_LOG}| Deny-label policy | PASS | no deny labels present |\n"
          fi

          echo "gate_pass=$GATE_PASS" >> $GITHUB_OUTPUT
          {
            echo "gate_log<<EOF"
            printf "$GATE_LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Write decision summary
        if: always()
        env:
          GATE_PASS: ${{ steps.gates.outputs.gate_pass }}
          GATE_LOG: ${{ steps.gates.outputs.gate_log }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Dependabot auto-merge policy evaluation -- PR #${PR_NUMBER}"
            echo ""
            if [ "$GATE_PASS" = "true" ]; then
              echo "Decision: ALLOW -- deny-label gate passed; auto-merge may be armed."
            else
              echo "Decision: BLOCK -- deny-label gate failed; auto-merge NOT armed."
            fi
            echo ""
            echo "| Gate | Result | Reason |"
            echo "|------|--------|--------|"
            printf "$GATE_LOG"
          } >> $GITHUB_STEP_SUMMARY

      - name: Enable auto-merge for dependabot PR
        if: steps.gates.outputs.gate_pass == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_transient_gh_error() {
            printf '%s' "$1" | grep -Eiq 'ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|socket hang up|temporary failure|rate limit|502|503|504'
          }

          retry_gh() {
            attempts=3
            delay=2
            attempt=1
            while true; do
              if output="$("$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              if is_transient_gh_error "$output" && [ "$attempt" -lt "$attempts" ]; then
                echo "Transient GitHub CLI error (attempt $attempt/$attempts); retrying in ${delay}s..." >&2
                sleep "$delay"
                delay=$((delay * 2))
                attempt=$((attempt + 1))
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$status"
            done
          }

          retry_gh gh pr merge --auto --squash "$PR_URL"