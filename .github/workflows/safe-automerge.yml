name: safe-automerge

# Unattended merge for explicitly allowlisted low-risk PRs only.
# Policy: src/automerge-eligibility.ts and .github/docs/auto-merge-policy.md.
#
# - Never runs PR-head code: only main's evaluator is checked out.
# - Never approves, labels, comments, uses --admin, or arms --auto.
# - Preview by default. Merging requires the repository variable
#   AUTOMERGE_MODE=enforce AND the PR's task type listed in
#   AUTOMERGE_ENABLED_TASK_TYPES (comma separated: dependabot-patch, docs-only).
# - Merges with --match-head-commit, so GitHub rejects a stale head and still
#   enforces branch protection and required checks.

on:
  workflow_run:
    workflows: [test-and-build]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Evaluate a single PR number (blank = all open PRs to main)'
        required: false
        type: string

permissions: {}

concurrency:
  group: safe-automerge
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate unattended merge eligibility
    if: >-
      github.repository == 'RocketDelivery2/github-copilot-jackhammer-service' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      merge_candidates: ${{ steps.evaluate.outputs.merge_candidates }}
      candidate_count: ${{ steps.evaluate.outputs.candidate_count }}
    steps:
      - name: Checkout main (policy code only)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect candidate PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_PRS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          : > candidates.tsv
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "$RUN_PRS_JSON" | jq -r --arg sha "$RUN_HEAD_SHA" '.[]? | [(.number|tostring), $sha] | @tsv' >> candidates.tsv
          else
            gh pr list --repo "$REPO" --base main --state open --limit 100 --json number,headRefOid \
              | jq -r '.[] | [(.number|tostring), .headRefOid] | @tsv' > open.tsv
            if [ -n "$INPUT_PR" ]; then
              if ! [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
                echo "::error::pr_number must be numeric"
                exit 1
              fi
              awk -F '\t' -v n="$INPUT_PR" '$1 == n' open.tsv >> candidates.tsv
            else
              cat open.tsv >> candidates.tsv
            fi
          fi
          echo "Candidates:"
          cat candidates.tsv

      - name: Evaluate candidates
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTOMERGE_EXPECTED_REPO: RocketDelivery2/github-copilot-jackhammer-service
          AUTOMERGE_EVENT_REPO: ${{ github.repository }}
          AUTOMERGE_ENABLED_TASK_TYPES: ${{ vars.AUTOMERGE_ENABLED_TASK_TYPES }}
          AUTOMERGE_MODE: ${{ vars.AUTOMERGE_MODE }}
        run: |
          # No `set -e`: one PR's evidence failure must not stop evaluation of the
          # others. Every failure path below produces a blocked result.
          set -uo pipefail
          FIELDS=number,state,isDraft,isCrossRepository,author,baseRefName,baseRefOid,headRefName,headRefOid,mergeStateStatus,reviewDecision,labels,changedFiles,files,statusCheckRollup,reviews
          BLOCKED='{"eligible":false,"enabled":false,"taskType":null,"headSha":null,"blockers":["Evidence: collection failed."],"gates":[]}'
          fetch_raw() {
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/$1?ref=$2" > "$3"
          }
          : > results.jsonl
          while IFS=$'\t' read -r -u 3 PR EXPECTED_SHA; do
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              continue
            fi
            WORK="evidence/$PR"
            mkdir -p "$WORK"
            unset AUTOMERGE_COMMITS_JSON_FILE AUTOMERGE_BASE_PACKAGE_JSON_FILE AUTOMERGE_HEAD_PACKAGE_JSON_FILE \
              AUTOMERGE_BASE_LOCKFILE_FILE AUTOMERGE_HEAD_LOCKFILE_FILE
            RESULT=""
            if gh pr view "$PR" --repo "$REPO" --json "$FIELDS" > "$WORK/pr.json"; then
              HEAD_REF=$(jq -r '.headRefName' "$WORK/pr.json")
              HEAD_OID=$(jq -r '.headRefOid' "$WORK/pr.json")
              BASE_OID=$(jq -r '.baseRefOid' "$WORK/pr.json")
              if [[ "$HEAD_REF" == dependabot/npm_and_yarn/* && "$HEAD_OID" =~ ^[0-9a-f]{40}$ && "$BASE_OID" =~ ^[0-9a-f]{40}$ ]]; then
                gh api --paginate --slurp "repos/$REPO/pulls/$PR/commits" > "$WORK/commits.json" \
                  && export AUTOMERGE_COMMITS_JSON_FILE="$WORK/commits.json"
                fetch_raw package.json "$BASE_OID" "$WORK/base-package.json" \
                  && export AUTOMERGE_BASE_PACKAGE_JSON_FILE="$WORK/base-package.json"
                fetch_raw package.json "$HEAD_OID" "$WORK/head-package.json" \
                  && export AUTOMERGE_HEAD_PACKAGE_JSON_FILE="$WORK/head-package.json"
                fetch_raw package-lock.json "$BASE_OID" "$WORK/base-lock.json" \
                  && export AUTOMERGE_BASE_LOCKFILE_FILE="$WORK/base-lock.json"
                fetch_raw package-lock.json "$HEAD_OID" "$WORK/head-lock.json" \
                  && export AUTOMERGE_HEAD_LOCKFILE_FILE="$WORK/head-lock.json"
              fi
              RESULT=$(AUTOMERGE_PR_JSON_FILE="$WORK/pr.json" AUTOMERGE_EXPECTED_HEAD_SHA="$EXPECTED_SHA" \
                node --import tsx src/automerge-eligibility-cli.ts)
            fi
            if ! echo "$RESULT" | jq -e 'type == "object"' > /dev/null 2>&1; then
              RESULT="$BLOCKED"
            fi
            echo "$RESULT" | jq -c --arg pr "$PR" '. + {number: ($pr|tonumber)}' >> results.jsonl
          done 3< candidates.tsv

          CANDIDATES=$(jq -sc '[.[] | select(.eligible == true and .enabled == true and (.headSha | type) == "string") | {number, headSha, taskType}]' results.jsonl)
          echo "merge_candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"
          echo "candidate_count=$(echo "$CANDIDATES" | jq 'length')" >> "$GITHUB_OUTPUT"

          {
            echo "## Safe auto-merge evaluation"
            echo ""
            echo "Mode: \`${AUTOMERGE_MODE:-preview}\` (merges only when \`enforce\`). Enabled task types: \`${AUTOMERGE_ENABLED_TASK_TYPES:-none}\`."
            echo ""
            echo "| PR | Task type | Eligible | Enabled | Blockers |"
            echo "|----|-----------|----------|---------|----------|"
            jq -r '"| #\(.number) | \(.taskType // "none") | \(.eligible) | \(.enabled) | \(.blockers | join("; ") | gsub("\\|"; "/")) |"' results.jsonl
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge eligible PRs (exact head)
    needs: evaluate
    if: >-
      vars.AUTOMERGE_MODE == 'enforce' &&
      needs.evaluate.outputs.candidate_count != '' &&
      needs.evaluate.outputs.candidate_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge with exact head match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATES: ${{ needs.evaluate.outputs.merge_candidates }}
        run: |
          set -uo pipefail
          FAILED=0
          while IFS=$'\t' read -r -u 3 PR SHA TASK; do
            if ! [[ "$PR" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Malformed merge candidate; skipping."
              FAILED=1
              continue
            fi
            echo "Merging PR #$PR ($TASK) at $SHA"
            if gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"; then
              echo "- Merged #$PR ($TASK) at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Merge of #$PR refused by GitHub (head moved or protection unmet)" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          done 3< <(echo "$CANDIDATES" | jq -r '.[] | [(.number|tostring), .headSha, .taskType] | @tsv')
          exit "$FAILED"
