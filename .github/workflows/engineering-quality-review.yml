name: engineering-quality-review

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create tracking issue for severe findings'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-review:
    name: Engineering quality review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        id: typecheck
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/typecheck-output.txt
          TC_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$TC_EXIT" >> $GITHUB_OUTPUT
          TC_ERRORS=$(grep -c "error TS" /tmp/typecheck-output.txt 2>/dev/null || echo "0")
          echo "error_count=$TC_ERRORS" >> $GITHUB_OUTPUT
          set -e

      - name: Detect code smells
        id: smells
        run: |
          set +e
          SMELLS=""
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Long functions (heuristic: functions with more than 60 lines)
          LONG_FUNCS=""
          while IFS= read -r file; do
            # Find function starts and measure distance to next function/end
            LONG=$(awk '
              /function[[:space:](]|=> \{|async \(/ { start=NR }
              start && NR - start > 60 && /^\}/ { print FILENAME ":" start "-" NR " (" NR-start " lines)"; start=0 }
            ' "$file" 2>/dev/null | head -5)
            if [ -n "$LONG" ]; then
              LONG_FUNCS="${LONG_FUNCS}\n$LONG"
            fi
          done < <(find src -name "*.ts" ! -name "*.test.ts" 2>/dev/null)

          if [ -n "$LONG_FUNCS" ]; then
            SMELLS="${SMELLS}\n#### Long functions (>60 lines)"
            SMELLS="${SMELLS}$LONG_FUNCS"
          fi

          # Magic numbers (literals that aren't 0, 1, -1, or in test files)
          MAGIC_COUNT=$(grep -rn --include="*.ts" \
            -E '[^a-zA-Z_][0-9]{2,}[^a-zA-Z_0-9]' src/ 2>/dev/null | \
            grep -v "\.test\." | grep -v "//.*[0-9]" | \
            grep -vE '(port|timeout|interval|max|min|limit|size|count|version|retry|delay|status|code|http)' | \
            grep -vE '[0-9]+\.[0-9]+\.[0-9]+' | \
            wc -l || echo "0")
          if [ "$MAGIC_COUNT" -gt "10" ]; then
            SMELLS="${SMELLS}\n- **Magic numbers:** $MAGIC_COUNT occurrences — consider named constants"
          fi

          # Duplicate string literals (same string used 3+ times)
          DUP_STRINGS=$(grep -roh --include="*.ts" '"[^"]\{10,\}"' src/ 2>/dev/null | \
            sort | uniq -c | sort -rn | awk '$1 >= 3 {print}' | head -5 || echo "")
          if [ -n "$DUP_STRINGS" ]; then
            SMELLS="${SMELLS}\n- **Duplicate string literals** (3+ uses): extract to named constants"
          fi

          # console.log in non-test source (prefer structured logging)
          CONSOLE_LOG_COUNT=$(grep -rn --include="*.ts" 'console\.log' src/ 2>/dev/null | \
            grep -v "\.test\." | wc -l || echo "0")
          if [ "$CONSOLE_LOG_COUNT" -gt "15" ]; then
            SMELLS="${SMELLS}\n- **High console.log density:** $CONSOLE_LOG_COUNT calls — consider structured logger"
          fi

          # any type usage (suppresses type safety)
          ANY_COUNT=$(grep -rn --include="*.ts" ': any\b\|as any\b' src/ 2>/dev/null | \
            grep -v "\.test\." | wc -l || echo "0")
          if [ "$ANY_COUNT" -gt "5" ]; then
            SMELLS="${SMELLS}\n- **TypeScript \`any\` usage:** $ANY_COUNT occurrences — tighten types"
          fi

          echo "smells<<EOF" >> $GITHUB_OUTPUT
          printf "${SMELLS:-none}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          SMELL_COUNT=$(printf "$SMELLS" | grep -c "^-\|^####" 2>/dev/null || echo "0")
          echo "smell_count=$SMELL_COUNT" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          set -e

      - name: Check SOLID alignment (heuristics)
        id: solid
        run: |
          set +e
          SOLID_ISSUES=""

          # Single Responsibility: large files doing too much
          LARGE_FILES=$(find src -name "*.ts" ! -name "*.test.ts" -exec wc -l {} \; 2>/dev/null | \
            awk '$1 > 300 {print $2 " (" $1 " lines)"}' | head -10 || echo "")
          if [ -n "$LARGE_FILES" ]; then
            SOLID_ISSUES="${SOLID_ISSUES}\n- **SRP:** Large files may have multiple responsibilities:\n$(echo "$LARGE_FILES" | sed 's/^/  - /')"
          fi

          # Open/Closed: hardcoded switch/if-else chains on type strings
          TYPE_SWITCH=$(grep -rn --include="*.ts" -E "switch\s*\(.*type|if.*=== '.*Type'" src/ 2>/dev/null | \
            grep -v "\.test\." | wc -l || echo "0")
          if [ "$TYPE_SWITCH" -gt "3" ]; then
            SOLID_ISSUES="${SOLID_ISSUES}\n- **OCP:** $TYPE_SWITCH type-based switch/if chains detected — consider polymorphism or strategy pattern"
          fi

          # Dependency Inversion: direct instantiation patterns
          NEW_IN_FUNC=$(grep -rn --include="*.ts" -E 'new [A-Z][a-zA-Z]+\(' src/ 2>/dev/null | \
            grep -v "\.test\." | grep -v "new Error\|new Map\|new Set\|new Date\|new URL\|new RegExp" | \
            wc -l || echo "0")
          if [ "$NEW_IN_FUNC" -gt "10" ]; then
            SOLID_ISSUES="${SOLID_ISSUES}\n- **DIP:** $NEW_IN_FUNC direct \`new\` instantiations — consider dependency injection"
          fi

          echo "solid_issues<<EOF" >> $GITHUB_OUTPUT
          printf "${SOLID_ISSUES:-none}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          set -e

      - name: Check formatting consistency
        id: formatting
        run: |
          set +e
          FORMAT_ISSUES=""

          # Mixed indentation (tabs vs spaces)
          TAB_FILES=$(grep -rl --include="*.ts" $'\t' src/ 2>/dev/null | wc -l || echo "0")
          if [ "$TAB_FILES" -gt "0" ]; then
            FORMAT_ISSUES="${FORMAT_ISSUES}\n- **Mixed indentation:** $TAB_FILES files use tabs (project uses spaces)"
          fi

          # Trailing whitespace
          TRAILING_WS=$(grep -rl --include="*.ts" ' $' src/ 2>/dev/null | wc -l || echo "0")
          if [ "$TRAILING_WS" -gt "3" ]; then
            FORMAT_ISSUES="${FORMAT_ISSUES}\n- **Trailing whitespace:** $TRAILING_WS files affected"
          fi

          # Windows line endings
          CRLF_FILES=$(find src -name "*.ts" -exec file {} \; 2>/dev/null | grep -c "CRLF" || echo "0")
          if [ "$CRLF_FILES" -gt "0" ]; then
            FORMAT_ISSUES="${FORMAT_ISSUES}\n- **Windows line endings (CRLF):** $CRLF_FILES files affected"
          fi

          echo "format_issues<<EOF" >> $GITHUB_OUTPUT
          printf "${FORMAT_ISSUES:-none}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          set -e

      - name: Produce quality report
        id: report
        env:
          TC_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TC_ERRORS: ${{ steps.typecheck.outputs.error_count }}
          SMELLS: ${{ steps.smells.outputs.smells }}
          SMELL_COUNT: ${{ steps.smells.outputs.smell_count }}
          SOLID: ${{ steps.solid.outputs.solid_issues }}
          FORMAT: ${{ steps.formatting.outputs.format_issues }}
          TIMESTAMP: ${{ steps.smells.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SEVERITY=0

          if [ "${TC_EXIT:-0}" != "0" ]; then SEVERITY=$((SEVERITY + 5)); fi
          if [ "${SMELL_COUNT:-0}" -gt "3" ]; then SEVERITY=$((SEVERITY + 3)); fi
          if echo "$SOLID" | grep -qE "^\- \*\*"; then SEVERITY=$((SEVERITY + 2)); fi
          if echo "$FORMAT" | grep -qE "^\- \*\*"; then SEVERITY=$((SEVERITY + 1)); fi

          {
            echo "## Engineering Quality Review — $TIMESTAMP"
            echo ""
            echo "**Severity score:** $SEVERITY / 11"
            echo ""
            echo "### Typecheck"
            if [ "${TC_EXIT:-0}" = "0" ]; then
              echo "✅ No type errors"
            else
              echo "❌ **$TC_ERRORS type error(s) detected**"
            fi
            echo ""
            echo "### Code smells"
            printf "$SMELLS"
            echo ""
            echo ""
            echo "### SOLID alignment"
            printf "$SOLID"
            echo ""
            echo ""
            echo "### Formatting consistency"
            printf "$FORMAT"
            echo ""
            echo ""
            echo "**Run:** $RUN_URL"
          } >> $GITHUB_STEP_SUMMARY

          echo "severity=$SEVERITY" >> $GITHUB_OUTPUT

      - name: Write machine-readable JSON report
        env:
          SMELLS: ${{ steps.smells.outputs.smells }}
          SOLID: ${{ steps.solid.outputs.solid_issues }}
          FORMAT: ${{ steps.formatting.outputs.format_issues }}
          SEVERITY: ${{ steps.report.outputs.severity }}
          TIMESTAMP: ${{ steps.smells.outputs.timestamp }}
        run: |
          cat > /tmp/quality-report.json <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "severity": ${SEVERITY:-0},
            "smells": $(printf '%s' "$SMELLS" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))"),
            "solid_issues": $(printf '%s' "$SOLID" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))"),
            "format_issues": $(printf '%s' "$FORMAT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          }
          EOF

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report-${{ github.run_number }}
          retention-days: 30
          path: /tmp/quality-report.json

      - name: Post PR comment with quality findings
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMELLS: ${{ steps.smells.outputs.smells }}
          SOLID: ${{ steps.solid.outputs.solid_issues }}
          SEVERITY: ${{ steps.report.outputs.severity }}
          TIMESTAMP: ${{ steps.smells.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${SEVERITY:-0}" -lt "2" ]; then
            echo "Severity below PR comment threshold; skipping comment."
            exit 0
          fi

          COMMENT_FILE=$(mktemp)
          {
            echo "## Engineering Quality Review — $TIMESTAMP"
            echo ""
            echo "**Severity:** $SEVERITY / 11"
            echo ""
            echo "### Code smells"
            printf '%s\n' "$SMELLS"
            echo ""
            echo "### SOLID alignment"
            printf '%s\n' "$SOLID"
            echo ""
            echo "[Full report]($RUN_URL)"
            echo ""
            echo "---"
            echo "*Posted by engineering-quality-review workflow. Read-only automated analysis.*"
          } > "$COMMENT_FILE"
          gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          rm -f "$COMMENT_FILE"

      - name: Create issue for severe maintainability risks
        if: |
          steps.report.outputs.severity != '0' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.create_issue == 'true'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEVERITY: ${{ steps.report.outputs.severity }}
          SMELLS: ${{ steps.smells.outputs.smells }}
          SOLID: ${{ steps.solid.outputs.solid_issues }}
          FORMAT: ${{ steps.formatting.outputs.format_issues }}
          TIMESTAMP: ${{ steps.smells.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HIGH_THRESHOLD=5
          if [ "${SEVERITY:-0}" -lt "$HIGH_THRESHOLD" ]; then
            echo "Severity $SEVERITY below threshold $HIGH_THRESHOLD; skipping issue."
            exit 0
          fi

          ISSUE_FILE=$(mktemp)
          {
            echo "## Engineering Quality Review: Severe Findings"
            echo ""
            echo "**Timestamp:** $TIMESTAMP"
            echo "**Severity:** $SEVERITY / 11"
            echo ""
            echo "### Code smells"
            printf '%s\n' "$SMELLS"
            echo ""
            echo "### SOLID alignment"
            printf '%s\n' "$SOLID"
            echo ""
            echo "### Formatting"
            printf '%s\n' "$FORMAT"
            echo ""
            echo "**Workflow run:** $RUN_URL"
            echo ""
            echo "---"
            echo "*Auto-created by engineering-quality-review workflow.*"
          } > "$ISSUE_FILE"

          gh issue create \
            --title "[Quality] Severe maintainability findings — $TIMESTAMP" \
            --body-file "$ISSUE_FILE" \
            --label "automation" \
            --label "quality" \
            2>/dev/null || \
          gh issue create \
            --title "[Quality] Severe maintainability findings — $TIMESTAMP" \
            --body "Severe quality findings detected. See workflow run: $RUN_URL"
          rm -f "$ISSUE_FILE"
